<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Galaxy</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; outline:none; }
        canvas { display:block; width:100vw; height:100vh; }
        #ui {
            position:absolute; top:20px; left:20px;
            color:rgba(255,255,255,0.9); background:rgba(0,0,0,0.6);
            padding:15px; border-radius:8px; pointer-events:none;
            backdrop-filter:blur(4px);
        }
        h1 { margin:0 0 4px; font-size:1.2rem; }
        p  { margin:2px 0; font-size:0.85rem; color:#bbb; }
        #seed-row { display:flex; gap:5px; margin-top:12px; pointer-events:auto; }
        #seed-input { width:120px; padding:4px; border:none; border-radius:4px; background:rgba(255,255,255,0.85); }
        #seed-btn   { padding:4px 8px; border:none; border-radius:4px; background:#fff; cursor:pointer; font-weight:bold; }
        #walk-prompt {
            position:absolute; bottom:50px; left:50%; transform:translateX(-50%);
            background:rgba(255,255,255,0.9); color:#000;
            padding:10px 20px; border-radius:20px; font-weight:bold;
            display:none; pointer-events:none; text-transform:uppercase; font-size:0.85rem;
        }
        #crosshair {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:4px; height:4px; background:rgba(255,255,255,0.5);
            border-radius:50%; display:none; pointer-events:none;
        }
    </style>
</head>
<body tabindex="0">
    <div id="ui">
        <h1>Procedural Galaxy</h1>
        <p id="mode-text">Mode: Orbit</p>
        <p id="system-text">System: —</p>
        <p id="planet-text">Planet: —</p>
        <p id="planet-type-text">Type: —</p>
        <p id="planet-nav-text" style="color:#888;">← → to cycle planets</p>
        <p id="hint-text" style="margin-top:8px;color:#888;">Scroll to zoom · Click any planet to travel</p>
        <div id="seed-row">
            <input type="text" id="seed-input" value="RedTeam" placeholder="Galaxy seed…">
            <button id="seed-btn">Generate</button>
        </div>
    </div>
    <div id="walk-prompt">Click to enter First-Person</div>
    <div id="crosshair"></div>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="planet.js"></script>
</body>
</html>
